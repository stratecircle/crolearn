<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CroLearn — Croatian, from zero</title>
    <meta name="theme-color" content="#ffffff" />
    <!-- The šahovnica mark (see ui/kit.tsx Sahovnica) as the app icon. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'><rect width='4' height='4' fill='%23fff'/><g fill='%23c8342c'><rect x='0' y='0' width='1' height='1'/><rect x='2' y='0' width='1' height='1'/><rect x='1' y='1' width='1' height='1'/><rect x='3' y='1' width='1' height='1'/><rect x='0' y='2' width='1' height='1'/><rect x='2' y='2' width='1' height='1'/><rect x='1' y='3' width='1' height='1'/><rect x='3' y='3' width='1' height='1'/></g></svg>" />
    <!-- Paint the saved theme before first paint. The module bundle is deferred,
         so without this blocking snippet dark-mode users get a white flash. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("crolearn.theme") || "system";
          var dark = m === "dark" || (m === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
            var t = document.querySelector('meta[name="theme-color"]');
            if (t) t.content = "#131316";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
